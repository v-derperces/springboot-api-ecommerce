spring.application.name=APIBoulangerie

server.port=NumeroDePort

logging.level.root=error
logging.level.fr.afpa.pompey.APIBoulangerie=info
logging.level.org.springframework.data=info
logging.level.org.springframework.jdbc.core.JdbcTemplate=debug
logging.level.org.springframework.boot.web.embedded.tomcat=info

# Paramétrage de la BDD
spring.datasource.url=jdbc:mysql://localhost:3306/NomBDD
spring.datasource.username=login
spring.datasource.password=mdp
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update